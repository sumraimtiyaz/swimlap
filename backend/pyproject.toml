[project]
name = "swimlap-backend"
version = "1.0.0"
description = "SwimLap timing API — FastAPI backend with a framework-agnostic domain core."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "passlib[bcrypt]>=1.7",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
