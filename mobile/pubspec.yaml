name: swimlap
description: SwimLap — tap-to-record swim lap timing for timers.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0     # durable offline lap buffer
  flutter_secure_storage: ^9.2.0 # auth token in iOS keychain / Android keystore
  connectivity_plus: ^6.0.0      # online/offline detection to drive auto-sync
  wakelock_plus: ^1.2.0          # keep the screen awake while timing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
